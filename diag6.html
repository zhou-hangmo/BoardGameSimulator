<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>IPv6 链路诊断</title>
<style>
body{font:13px/1.5 monospace;background:#111;color:#0f0;padding:16px;margin:0;word-break:break-all}
h2{color:#0af;font-size:14px;margin:18px 0 6px}
.btn{background:#222;color:#0f0;border:1px solid #0f0;border-radius:6px;padding:6px 14px;margin:4px 6px 4px 0;cursor:pointer;font-size:13px}
.btn:disabled{opacity:.4;cursor:default}
textarea{width:100%;height:64px;background:#000;color:#ff0;border:1px solid #444;border-radius:6px;font:12px monospace;box-sizing:border-box;margin:6px 0}
.qr{max-width:240px;border:4px solid #fff;border-radius:8px;background:#fff;margin:8px 0}
.err{color:#ff4444}.ok{color:#0f0}.hl{color:#ff0}.s{color:#888}.step{color:#0af;margin-top:14px;font-weight:bold}
table{border-collapse:collapse;margin:6px 0;width:100%}
td,th{border:1px solid #333;padding:3px 6px;font-size:11px;text-align:left}
tr.sel td{background:#1a3a1a}
#status{position:fixed;top:8px;right:16px;color:#888;font-size:11px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:4px 0}
small{color:#888}
</style>
</head>
<body>
<div id="status">初始化...</div>
<h2>模块① 设备/网络指纹</h2>
<div id="m1"></div>
<h2>模块② IPv6 候选收集</h2>
<div class="row"><button class="btn" id="btn-cand">🔄 重新收集</button><small>STUN: stun.l.google.com:19302</small></div>
<div id="m2"></div>
<h2>模块③ 双端建连 + getStats 路径</h2>
<div class="row">
  <button class="btn" id="btn-host">创建端 (host)</button>
  <button class="btn" id="btn-guest">加入端 (guest)</button>
</div>
<div id="m3"></div>
<script type="module" src="/src/diag6-main.ts"></script>
</body>
</html>
