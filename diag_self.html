<!DOCTYPE html><html><head><meta charset="UTF-8" /></head>
<body style="font:14px monospace;background:#111;color:#0f0;padding:16px;white-space:pre-wrap"><div id="out"></div>
<script>
const log = (cls, s) => { const el=document.getElementById('out'); const span=document.createElement('span'); span.className=cls||''; span.textContent=s+'\n'; el.appendChild(span); };
const ICE = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

function extract(sdp) {
  const m = sdp.match(/a=ice-ufrag:(\S+)/), pw = sdp.match(/a=ice-pwd:(\S+)/), f = sdp.match(/a=fingerprint:(\S+ \S+)/), s = sdp.match(/a=setup:(\S+)/);
  const sp = sdp.match(/a=sctp-port:(\d+)/), conn = sdp.match(/c=IN\s+(\S+)\s+(\S+)/), media = sdp.match(/m=application\s+(\d+)\s+(\S+)/);
  const cands = [...sdp.matchAll(/a=(candidate:\S+ \d+ [uU][dD][pP] \d+ \S+ \S+ typ (host|srflx).*)/g)].map(x => x[1]).filter(c => !c.includes('.local') && !c.includes('raddr 0.0.0.0'));
  if (!m || !pw || !f || !s) throw new Error('missing fields');
  return { u:m[1], w:pw[1], f:f[1], s:s[1], p:sp?.[1]??'5000', c:cands, conn:conn?.[1]??'IP4', addr:conn?.[2]??'0.0.0.0', mport:media?.[1]??'9', mproto:media?.[2]??'UDP/DTLS/SCTP webrtc-datachannel' };
}

async function tpl() { const pc = new RTCPeerConnection(ICE); try { pc.createDataChannel('_'); return (await pc.createOffer()).sdp; } finally { pc.close(); } }

function apply(tmpl, f) {
  return tmpl
    .replace(/m=application\s+\d+\s+\S+/g, 'm=application '+f.mport+' '+f.mproto)
    .replace(/c=IN\s+\S+\s+\S+/g, 'c=IN '+f.conn+' '+f.addr)
    .replace(/a=ice-ufrag:\S+/g, 'a=ice-ufrag:'+f.u).replace(/a=ice-pwd:\S+/g, 'a=ice-pwd:'+f.w)
    .replace(/a=fingerprint:\S+ \S+/g, 'a=fingerprint:'+f.f).replace(/a=setup:\S+/g, 'a=setup:'+f.s)
    .replace(/a=sctp-port:\d+/g, 'a=sctp-port:'+f.p).replace(/a=candidate:[^\r\n]*\r?\n?/g, '')
    .trimEnd() + '\r\n' + f.c.map(c => 'a=' + c).join('\r\n');
}

function wice(pc) { return new Promise(r => { if(pc.iceGatheringState==='complete')r(); else{pc.onicegatheringstatechange=()=>{if(pc.iceGatheringState==='complete')r()};setTimeout(r,3000);}}); }

async function run() {
  log('ok','=== Step1: 原生 offer ===');
  const pc = new RTCPeerConnection(ICE); pc.createDataChannel('game'); await pc.setLocalDescription(await pc.createOffer()); await wice(pc);
  const orig = pc.localDescription.sdp; log('','长度='+orig.length); log('',orig);

  log('ok','=== Step2: extract ===');
  const ff = extract(orig); log('','u='+ff.u+' c='+ff.c.length); ff.c.forEach((x,i)=>log('',i+': '+x));

  log('ok','=== Step3: template ===');
  const tm = await tpl(); log('','长度='+tm.length); log('',tm);

  log('ok','=== Step4: apply ===');
  const rb = apply(tm, ff); log('','长度='+rb.length); log('',rb);

  log('ok','=== Step5: setRemote ===');
  const pc2 = new RTCPeerConnection(ICE); pc2.ondatachannel = () => {};
  try { await pc2.setRemoteDescription(new RTCSessionDescription({type:'offer',sdp:rb})); log('ok','✅ PASS!'); }
  catch(e) { log('err','❌ '+e.message); log('','<button id=cp style=\"cursor:pointer;background:#333;color:#ff0;border:1px solid #ff0;padding:4px 10px;\">📋</button>'); setTimeout(()=>document.getElementById('cp').onclick=()=>navigator.clipboard.writeText(e.message+'\n\norig:\n'+orig+'\n\ntmpl:\n'+tm+'\n\nrb:\n'+rb),0); }
  pc2.close(); pc.close();
}
run().catch(e => log('err','FATAL: '+e.message));
</script></body></html>
